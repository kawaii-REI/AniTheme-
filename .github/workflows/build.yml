name: Build AniTheme APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Generate placeholder icons
        run: |
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$dpi
            convert -size 192x192 xc:#E8553E \
              -fill white -font DejaVu-Sans-Bold -pointsize 80 \
              -gravity center -annotate 0 "五" \
              app/src/main/res/mipmap-$dpi/ic_launcher.png 2>/dev/null || \
            python3 -c "
          import struct, zlib
          def png(w,h,color):
              def chunk(t,d):
                  c=struct.pack('>I',len(d))+t+d
                  return c+struct.pack('>I',zlib.crc32(c[4:])&0xffffffff)
              raw=b''.join(b'\x00'+bytes(color)*w for _ in range(h))
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          open('app/src/main/res/mipmap-$dpi/ic_launcher.png','wb').write(png(192,192,[232,85,62]))
          "
            cp app/src/main/res/mipmap-$dpi/ic_launcher.png \
               app/src/main/res/mipmap-$dpi/ic_launcher_round.png
          done

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.7 && chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AniTheme-APK
          path: app/build/outputs/apk/debug/app-debug.apk
